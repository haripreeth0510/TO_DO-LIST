<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do list</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#1b2333;--muted:#6b7690;--accent:#3b5bdb;--accent-ink:#fff;--line:#dde2ec;--danger:#d6336c;--soft:#e8edfb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--surface:#1b2029;--ink:#e7eaf2;--muted:#8f99ae;--accent:#7c93f5;--accent-ink:#12151c;--line:#2a303c;--danger:#f06595;--soft:#252c40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--surface:#1b2029;--ink:#e7eaf2;--muted:#8f99ae;--accent:#7c93f5;--accent-ink:#12151c;--line:#2a303c;--danger:#f06595;--soft:#252c40;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:40px 20px 64px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
#count{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
form{display:flex;gap:8px;padding:8px;margin-bottom:16px}
input[type=text]{flex:1;min-width:0;font:inherit;color:var(--ink);background:transparent;border:0;padding:10px 12px;border-radius:8px}
input[type=text]::placeholder{color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text]:focus-visible{outline-offset:-2px}
.add{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 18px}
.add:hover{filter:brightness(1.08)}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{background:transparent;color:var(--muted);padding:6px 12px;font-size:14px;font-weight:500}
.tab[aria-pressed=true]{background:var(--soft);color:var(--accent)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.check{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:0;border:2px solid var(--line);border-radius:50%;cursor:pointer;display:grid;place-content:center;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--accent)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.label{flex:1;min-width:0;overflow-wrap:anywhere}
li.done .label{color:var(--muted);text-decoration:line-through}
.edit{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--accent);border-radius:8px;padding:6px 10px}
.acts{display:flex;gap:2px}
.icon{background:transparent;color:var(--muted);width:34px;height:34px;display:grid;place-content:center}
.icon:hover{background:var(--soft);color:var(--accent)}
.icon.del:hover{color:var(--danger)}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.clear{background:transparent;color:var(--muted);font-size:14px;padding:6px 10px}
.clear:hover{color:var(--danger)}
#historyActions{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
#historyActions[hidden]{display:none}
#historyActions input{accent-color:var(--accent)}
.history-check{flex:none;width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
:root{--hi:#e03131;--md:#c26a00;--lo:#2b8a3e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hi:#ff8787;--md:#ffa94d;--lo:#69db7c}}
:root[data-theme="dark"]{--hi:#ff8787;--md:#ffa94d;--lo:#69db7c}
header{align-items:center}
.hright{display:flex;align-items:center;gap:10px}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:50%}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 6px;cursor:pointer}
.tag{flex:none;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.tag.high{--c:var(--hi)}.tag.medium{--c:var(--md)}.tag.low{--c:var(--lo)}
li.done .tag{opacity:.5}
.progress{padding:14px 16px;margin-bottom:16px}
.ptop{display:flex;justify-content:space-between;font-size:14px;font-weight:500;margin-bottom:10px}
#ppct{color:var(--accent);font-weight:700}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
#fill{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .3s ease}
input[type=date]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
form{flex-wrap:wrap}
#addForm input[type=text]{flex:1 1 180px}
li .edit{flex:1 1 140px}
li.editing{flex-wrap:wrap}
.due{flex:none;font-size:12px;color:var(--muted)}
.due.over{color:var(--danger);font-weight:600}
li.done .due{opacity:.6}
.today{margin:2px 0 0;color:var(--muted);font-size:14px}
.tag.ev-created,.tag.ev-restored{--c:var(--accent)}.tag.ev-completed{--c:var(--lo)}.tag.ev-reopened{--c:var(--md)}.tag.ev-edited{--c:var(--muted)}.tag.ev-deleted,.tag.ev-cleared{--c:var(--hi)}
.card{overflow:hidden}
.dayhead{background:var(--bg);color:var(--muted);font-size:13px;font-weight:600;padding:8px 14px}
.task-group{margin-bottom:12px}
.task-group .dayhead{border-bottom:1px solid var(--line)}
.task-empty{margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header><div><h1>Today</h1><p class="today" id="todayDate"></p></div><div class="hright"><span id="count"></span><button type="button" class="icon themebtn" id="theme"></button></div></header>
  <section class="progress card" aria-label="Task progress">
    <div class="ptop"><span id="ptext"></span><span id="ppct"></span></div>
    <div class="bar" id="bar" role="progressbar" aria-label="Completed tasks" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
  </section>
  <form id="addForm" class="card">
    <input type="text" id="newTask" placeholder="Add a task" aria-label="New task" autocomplete="off">
    <select id="newPri" aria-label="Priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select>
    <input type="date" id="newDue" aria-label="Due date">
    <button class="add" type="submit">Add task</button>
  </form>
  <div class="tabs" role="group" aria-label="Filter tasks">
    <button class="tab" data-f="all" aria-pressed="true">All</button>
    <button class="tab" data-f="active" aria-pressed="false">Active</button>
    <button class="tab" data-f="done" aria-pressed="false">Completed</button>
    <button class="tab" data-f="history" aria-pressed="false">History</button>
  </div>
  <div id="taskGroups"></div><div class="empty card task-empty" id="taskEmpty" hidden></div>
  <div class="card" id="historyCard" hidden><ul id="list"></ul><div class="empty" id="empty" hidden></div></div>
  <footer><div id="historyActions" hidden><label><input id="selectAllHistory" type="checkbox"> Select all</label><button class="clear" id="deleteHistory" type="button" disabled>Delete selected</button></div><button class="clear" id="clear" hidden>Clear completed</button></footer>
</main>
<script>
(function(){
  var KEY="todo-items-v1", THEME="todo-theme-v1", STATE="todo-state-v2", tasks=[], filter="all", editing=null, selectedHistory=[];
  var PRI={high:"High",medium:"Medium",low:"Low"};
  var LABEL={created:"Added",completed:"Completed",reopened:"Reopened",edited:"Edited",deleted:"Deleted",cleared:"Cleared",restored:"Restored"};
  function dayLabel(ts){
    var d=new Date(ts), k=dstr(d), now=new Date(), y=new Date(); y.setDate(now.getDate()-1);
    var full=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    return k===dstr(now)?"Today, "+full:(k===dstr(y)?"Yesterday, "+full:full);
  }
  function log(type,t){ history.push({time:Date.now(),type:type,text:t.text,tid:t.id}); }
  function renderHistory(){
    list.innerHTML="";
    var ev=history.slice().reverse();
    var historyActions=document.getElementById("historyActions"),
        selectAllHistory=document.getElementById("selectAllHistory"),
        deleteHistory=document.getElementById("deleteHistory");
    selectedHistory=selectedHistory.filter(function(item){return history.indexOf(item)!==-1;});
    historyActions.hidden=false;
    selectAllHistory.checked=ev.length>0&&ev.every(function(e){return selectedHistory.indexOf(e)!==-1;});
    selectAllHistory.indeterminate=!selectAllHistory.checked&&selectedHistory.length>0;
    selectAllHistory.disabled=!ev.length;
    deleteHistory.disabled=!selectedHistory.length;
    var lastDay="";
    ev.forEach(function(e){
      var dk=dstr(new Date(e.time));
      if(dk!==lastDay){ lastDay=dk; var h=document.createElement("li"); h.className="dayhead"; h.textContent=dayLabel(e.time); list.appendChild(h); }
      var li=document.createElement("li"), tg=document.createElement("span"), s=document.createElement("span"), d=document.createElement("span");
      var cb=document.createElement("input"); cb.type="checkbox"; cb.className="history-check"; cb.checked=selectedHistory.indexOf(e)!==-1;
      cb.setAttribute("aria-label","Select “"+e.text+"” history entry");
      cb.onchange=function(){ if(cb.checked){ if(selectedHistory.indexOf(e)===-1) selectedHistory.push(e); } else { selectedHistory=selectedHistory.filter(function(item){return item!==e;}); } render(); };
      tg.className="tag ev-"+e.type; tg.textContent=LABEL[e.type]||e.type;
      s.className="label"; s.textContent=e.text;
      d.className="due"; d.textContent=new Date(e.time).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
      li.appendChild(cb); li.appendChild(tg); li.appendChild(s); li.appendChild(d);
      var t=tasks.filter(function(x){return x.id===e.tid})[0];
      var last=history.filter(function(x){return x.tid===e.tid}).pop();
      if(t&&t.del&&last===e&&(e.type==="deleted"||e.type==="cleared")){
        var rb=document.createElement("button"); rb.type="button"; rb.className="clear"; rb.textContent="Restore";
        rb.onclick=function(){ delete t.del; log("restored",t); save(); render(); };
        li.appendChild(rb);
      }
      list.appendChild(li);
    });
    empty.hidden=!!ev.length; empty.textContent="No activity yet. Every change you make is recorded here.";
  }
  function dstr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function fmtDue(s){
    var now=new Date(), tm=new Date(); tm.setDate(now.getDate()+1);
    if(s===dstr(now)) return "Today";
    if(s===dstr(tm)) return "Tomorrow";
    return new Date(s+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
  }
  var newDue=document.getElementById("newDue"), dueDateKey="todo-due-date-v1";
  try{
    var savedDue=JSON.parse(localStorage.getItem(dueDateKey));
    if(savedDue&&savedDue.day===dstr(new Date())&&/^\d{4}-\d{2}-\d{2}$/.test(savedDue.value)){
      newDue.value=savedDue.value;
    } else localStorage.removeItem(dueDateKey);
  }catch(e){}
  newDue.onchange=function(){
    try{
      if(newDue.value) localStorage.setItem(dueDateKey,JSON.stringify({day:dstr(new Date()),value:newDue.value}));
      else localStorage.removeItem(dueDateKey);
    }catch(e){}
  };
  var history=[], updated=0;
  function adopt(s){
    tasks=s.tasks||[]; history=s.history||[]; updated=s.updated||0;
    tasks.forEach(function(t){
      if(Number.isFinite(t.createdAt)) return;
      var created=history.filter(function(e){return e.tid===t.id&&e.type==="created";})[0];
      var fromId=Number(t.id);
      t.createdAt=created?created.time:(Number.isFinite(fromId)&&fromId>0?fromId:Date.now());
    });
    tasks.forEach(function(t){
      if(!t.done||Number.isFinite(t.completedAt)) return;
      for(var i=history.length-1;i>=0;i--){
        var event=history[i];
        if(event.tid===t.id&&(event.type==="completed"||event.type==="reopened")){
          if(event.type==="completed") t.completedAt=event.time;
          break;
        }
      }
    });
  }
  try{ var raw=localStorage.getItem(STATE); if(raw){ adopt(JSON.parse(raw)); } else { var old=localStorage.getItem(KEY); if(old) tasks=JSON.parse(old)||[]; } }catch(e){ tasks=[]; history=[]; }
  var pushFn=null, pushTimer=null;
  function save(){
    updated=Date.now();
    try{ localStorage.setItem(STATE,JSON.stringify({tasks:tasks,history:history,updated:updated})); }catch(e){}
    if(pushFn){ clearTimeout(pushTimer); pushTimer=setTimeout(pushFn,600); }
  }
  var list=document.getElementById("list"), empty=document.getElementById("empty"),
      count=document.getElementById("count"), clearBtn=document.getElementById("clear"),
      input=document.getElementById("newTask"), taskGroups=document.getElementById("taskGroups"),
      taskEmpty=document.getElementById("taskEmpty"), historyCard=document.getElementById("historyCard");
  document.getElementById("selectAllHistory").onchange=function(){
    selectedHistory=this.checked?history.slice():[];
    render();
  };
  document.getElementById("deleteHistory").onclick=function(){
    if(!selectedHistory.length) return;
    history=history.filter(function(e){return selectedHistory.indexOf(e)===-1;});
    selectedHistory=[];
    save(); render();
  };
  var ICON={
    edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    del:'<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
    ok:'<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>',
    x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };
  function btn(cls,label,svg,fn){
    var b=document.createElement("button"); b.type="button"; b.className="icon "+cls;
    b.setAttribute("aria-label",label); b.title=label; b.innerHTML=svg; b.onclick=fn; return b;
  }
  function render(){
    var live=tasks.filter(function(t){return !t.del});
    var left=live.filter(function(t){return !t.done}).length;
    count.textContent=left+(left===1?" task left":" tasks left");
    clearBtn.hidden=filter==="history"||!live.some(function(t){return t.done});
    document.getElementById("historyActions").hidden=filter!=="history";
    var today=dstr(new Date());
    var daily=live.filter(function(t){return t.due===today});
    var total=daily.length;
    var doneN=daily.filter(function(t){
      return t.done&&Number.isFinite(t.completedAt)&&dstr(new Date(t.completedAt))===today;
    }).length;
    var pct=total?Math.round(doneN/total*100):0;
    document.getElementById("ptext").textContent=total?doneN+" of "+total+" completed today":"No tasks due today";
    document.getElementById("ppct").textContent=pct+"%";
    document.getElementById("fill").style.width=pct+"%";
    document.getElementById("bar").setAttribute("aria-valuenow",pct);
    if(filter==="history"){
      taskGroups.hidden=true; taskEmpty.hidden=true; historyCard.hidden=false;
      renderHistory(); return;
    }
    taskGroups.hidden=false; historyCard.hidden=true;
    var shown=live.filter(function(t){return filter==="all"||(filter==="done"?t.done:!t.done)});
    taskGroups.innerHTML="";
    shown.sort(function(a,b){
      if(!a.due) return b.due?1:(b.createdAt-a.createdAt);
      if(!b.due) return -1;
      return a.due===b.due?b.createdAt-a.createdAt:(a.due<b.due?-1:1);
    });
    var lastDay=null, groupList=null;
    shown.forEach(function(t){
      var day=t.due||"no-due";
      if(day!==lastDay){
        lastDay=day;
        var group=document.createElement("section"); group.className="card task-group";
        var heading=document.createElement("div"); heading.className="dayhead";
        heading.textContent=t.due?dayLabel(new Date(t.due+"T00:00:00").getTime()):"No due date";
        groupList=document.createElement("ul"); group.appendChild(heading); group.appendChild(groupList); taskGroups.appendChild(group);
      }
      var li=document.createElement("li"); if(t.done) li.className="done";
      var cb=document.createElement("input"); cb.type="checkbox"; cb.className="check"; cb.checked=t.done;
      cb.setAttribute("aria-label","Mark “"+t.text+"” as completed");
      cb.onchange=function(){
        t.done=cb.checked;
        if(t.done) t.completedAt=Date.now(); else delete t.completedAt;
        log(t.done?"completed":"reopened",t); save(); render();
      };
      li.appendChild(cb);
      if(editing===t.id){
        var ed=document.createElement("input"); ed.type="text"; ed.className="edit"; ed.value=t.text; ed.setAttribute("aria-label","Edit task");
        var ps=document.createElement("select"); ps.setAttribute("aria-label","Priority");
        Object.keys(PRI).forEach(function(k){ var o=document.createElement("option"); o.value=k; o.textContent=PRI[k]; ps.appendChild(o); });
        ps.value=t.p||"medium";
        var dd=document.createElement("input"); dd.type="date"; dd.value=t.due||""; dd.setAttribute("aria-label","Due date");
        function commit(){ var v=ed.value.trim(); if(v){ var changed=v!==t.text||ps.value!==(t.p||"medium")||dd.value!==(t.due||""); t.text=v; t.p=ps.value; t.due=dd.value; if(changed) log("edited",t); save(); } editing=null; render(); }
        ed.onkeydown=function(e){ if(e.key==="Enter"){e.preventDefault();commit();} else if(e.key==="Escape"){editing=null;render();} };
        li.classList.add("editing"); li.appendChild(ed); li.appendChild(ps); li.appendChild(dd);
        var a=document.createElement("div"); a.className="acts";
        a.appendChild(btn("","Save changes",ICON.ok,commit));
        a.appendChild(btn("","Cancel",ICON.x,function(){editing=null;render();}));
        li.appendChild(a);
        setTimeout(function(){ed.focus();ed.select();},0);
      } else {
        var s=document.createElement("span"); s.className="label"; s.textContent=t.text; li.appendChild(s);
        var p=t.p||"medium", tg=document.createElement("span"); tg.className="tag "+p; tg.textContent=PRI[p]; li.appendChild(tg);
        if(t.due){
          var over=!t.done&&t.due<dstr(new Date()), du=document.createElement("span");
          du.className="due"+(over?" over":""); du.textContent=(over?"Overdue ":"")+fmtDue(t.due);
          li.insertBefore(du,tg);
        }
        var acts=document.createElement("div"); acts.className="acts";
        acts.appendChild(btn("","Edit task",ICON.edit,function(){editing=t.id;render();}));
        acts.appendChild(btn("del","Delete task",ICON.del,function(){ t.del=Date.now(); log("deleted",t); save(); render(); }));
        li.appendChild(acts);
      }
      groupList.appendChild(li);
    });
    var msg="";
    if(!shown.length){
      msg = !tasks.length ? "No tasks yet. Add your first one above."
          : filter==="done" ? "Nothing completed yet."
          : "All caught up. Nothing left to do.";
    }
    taskEmpty.hidden=!!shown.length; taskEmpty.textContent=msg;
  }
  document.getElementById("addForm").onsubmit=function(e){
    e.preventDefault(); var v=input.value.trim(); if(!v) return;
    var createdAt=Date.now();
    var nt={id:createdAt+Math.random(),createdAt:createdAt,text:v,done:false,p:document.getElementById("newPri").value,due:newDue.value||""};
    tasks.unshift(nt); log("created",nt);
    input.value=""; save(); render(); input.focus();
  };
  clearBtn.onclick=function(){ tasks.forEach(function(t){ if(t.done&&!t.del){ t.del=Date.now(); log("cleared",t); } }); save(); render(); };
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){
    b.onclick=function(){
      filter=b.getAttribute("data-f");
      Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(o){o.setAttribute("aria-pressed",o===b)});
      render();
    };
  });
  var root=document.documentElement, tbtn=document.getElementById("theme");
  var SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  function isDark(){ var t=root.getAttribute("data-theme"); return t?t==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches; }
  function paint(){ var d=isDark(), l=d?"Switch to light mode":"Switch to dark mode"; tbtn.innerHTML=d?SUN:MOON; tbtn.setAttribute("aria-label",l); tbtn.title=l; }
  try{ var st=localStorage.getItem(THEME); if(st) root.setAttribute("data-theme",st); }catch(e){}
  tbtn.onclick=function(){ var n=isDark()?"light":"dark"; root.setAttribute("data-theme",n); try{ localStorage.setItem(THEME,n); }catch(e){} paint(); };
  function updateTodayDate(){
    document.getElementById("todayDate").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  }
  var displayedDay=dstr(new Date());
  updateTodayDate();
  setInterval(function(){
    var today=dstr(new Date());
    if(today!==displayedDay){
      displayedDay=today;
      newDue.value="";
      try{ localStorage.removeItem(dueDateKey); }catch(e){}
      updateTodayDate();
      render();
    }
  },60000);
  if(window.claude&&claude.use){
    Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
      var db=r[0], user=r[1]; if(!db||!user) return;
      return user.id().then(function(id){
        if(!id) return;
        var ref=db.doc("data/users/"+id+"/todo");
        pushFn=function(){ ref.set({state:JSON.stringify({tasks:tasks,history:history,updated:updated}),updated:updated}).catch(function(){}); };
        return ref.get().then(function(snap){
          var d=snap.exists?snap.data():null;
          if(d&&d.updated>updated){
            try{ adopt(JSON.parse(d.state)); localStorage.setItem(STATE,JSON.stringify({tasks:tasks,history:history,updated:updated})); }catch(e){}
            render();
          } else if(updated){ pushFn(); }
        });
      });
    }).catch(function(){});
  }
  paint();
  render();
})();
</script>
</body>
</html>
